CONFIG_SPI=y
CONFIG_INPUT=y
CONFIG_ZMK_MOUSE=y
CONFIG_ZMK_EXT_POWER=y

# BIOS-/UEFI-kompatibler USB-Tastaturmodus
CONFIG_ZMK_USB_BOOT=y
CONFIG_ZMK_HID_REPORT_TYPE_HKRO=y
CONFIG_ZMK_HID_KEYBOARD_REPORT_SIZE=6

CONFIG_PMW3610=y
CONFIG_PM_DEVICE=y
CONFIG_PMW3610_PM=y
CONFIG_PMW3610_CPI=700
CONFIG_PMW3610_CPI_DIVIDOR=1
CONFIG_PMW3610_ORIENTATION_180=y
CONFIG_PMW3610_SNIPE_CPI=200
CONFIG_PMW3610_SNIPE_CPI_DIVIDOR=1
CONFIG_PMW3610_SCROLL_TICK=32
CONFIG_PMW3610_INVERT_SCROLL_X=y
CONFIG_PMW3610_INVERT_SCROLL_Y=n
CONFIG_PMW3610_SMART_ALGORITHM=y
CONFIG_PMW3610_ACCELERATION_ALGORITHM=2
CONFIG_PMW3610_ACCELERATION_SENSITIVITY=10
CONFIG_PMW3610_RUN_DOWNSHIFT_TIME_MS=3264
CONFIG_PMW3610_REST1_SAMPLE_TIME_MS=20
#CONFIG_PMW3610_REST1_DOWNSHIFT_TIME_MS=9600
#CONFIG_PMW3610_REST2_SAMPLE_TIME_MS=
#CONFIG_PMW3610_REST2_DOWNSHIFT_TIME_MS=
#CONFIG_PMW3610_REST3_SAMPLE_TIME_MS=
#CONFIG_PMW3610_REST3_DOWNSHIFT_TIME_MS=
#CONFIG_PMW3610_FORCE_AWAKE=n
CONFIG_PMW3610_POLLING_RATE_250=y

CONFIG_ZMK_STUDIO=y
CONFIG_ZMK_STUDIO_LOCKING=n

# Show the host Num Lock state on the central OLED.
CONFIG_ZMK_HID_INDICATORS=y
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_CUSTOM=y

# The custom screen sets its font directly.  Do not initialize the dynamic
# monochrome theme here: unlike ZMK's built-in screen, a custom screen does
# not automatically receive the larger LVGL memory pool used by that theme.
CONFIG_LV_USE_THEME_MONO=n
CONFIG_LV_FONT_MONTSERRAT_12=y
CONFIG_LV_Z_MEM_POOL_SIZE=4096

CONFIG_ZMK_WIDGET_BATTERY_STATUS=y
CONFIG_ZMK_WIDGET_OUTPUT_STATUS=y
CONFIG_ZMK_WIDGET_LAYER_STATUS=y

CONFIG_KEYBALL61_NUMLOCK_SCREEN=y

CONFIG_PMW3610_AUTOMOUSE_TIMEOUT_MS=500
CONFIG_PMW3610_MOVEMENT_THRESHOLD=0
